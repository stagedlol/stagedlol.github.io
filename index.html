
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wic was here!</title>

<style>
@font-face {
  font-family: MostWanted;
  src: url("mostwanted(1).ttf") format("truetype");
}
@font-face {
  font-family: CodeFont;
  src: url("Code.ttf") format("truetype");
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  background: #080808;
  color: white;
  font-family: CodeFont, monospace;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* VIDEO BACKGROUND */

#bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  background: #080808;
  filter: brightness(.85) contrast(1.08);
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    rgba(0,0,0,.04),
    rgba(0,0,0,.4)
  );
}

/* SNOW */

#snow-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}

/* 3D SCENE */

.scene {
  position: relative;
  z-index: 3;
  perspective: 1000px;
}

/* FLOATING CARD */

.floating {
  position: relative;
  min-width: 380px;
  padding: 55px 50px;
  text-align: center;
  transform-style: preserve-3d;
  will-change: transform;
  opacity: 0;

  animation: entrance 1.5s cubic-bezier(.16,1,.3,1) forwards;
}

/* LIQUID GLASS */

.glass {
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: 45px;
  pointer-events: none;

  background:
    radial-gradient(
      circle at var(--mx, 50%) var(--my, 50%),
      rgba(255,255,255,.20),
      rgba(255,255,255,.035) 35%,
      transparent 70%
    ),
    rgba(255,255,255,.025);

  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);

  border: 1px solid rgba(255,255,255,.13);

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.18),
    0 15px 80px rgba(0,0,0,.18);

  transition: background .15s ease;
}

/* TITLE */

.glitch-text {
  position: relative;
  display: inline-block;
  font-family: MostWanted, sans-serif;
  font-size: clamp(65px, 10vw, 88px);
  letter-spacing: 5px;
  line-height: 1;
  text-transform: uppercase;
  transform: translateZ(65px);
  text-shadow: 0 0 30px rgba(255,255,255,.15);
}

.glitch-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.glitch-r { color: red; mix-blend-mode: screen; }
.glitch-g { color: lime; mix-blend-mode: screen; }
.glitch-b { color: #278bff; mix-blend-mode: screen; }

/* TYPEWRITER */

#typewriter {
  margin-top: 23px;
  min-height: 22px;
  font-size: 12px;
  letter-spacing: 2px;
  color: rgba(255,255,255,.85);
  text-shadow: 0 0 15px rgba(255,255,255,.3);
  transform: translateZ(45px);
}

/* SOCIALS */

.socials {
  margin-top: 38px;
  display: flex;
  justify-content: center;
  gap: 17px;
  transform: translateZ(75px);
}

.socials a {
  width: 49px;
  height: 49px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 17px;
  text-decoration: none;

  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.13);

  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  box-shadow: inset 0 1px 1px rgba(255,255,255,.13);

  transition: .35s cubic-bezier(.16,1,.3,1);
}

.socials img {
  width: 24px;
  height: 24px;
  object-fit: contain;
  filter: grayscale(100%) brightness(1.5);
  transition: .35s ease;
}

.socials a:hover {
  transform: translateY(-8px) scale(1.15);
  background: rgba(255,255,255,.19);
  border-color: rgba(255,255,255,.5);
  box-shadow:
    0 0 20px rgba(255,255,255,.2),
    0 0 40px rgba(255,255,255,.1);
}

.socials a:hover img {
  filter: grayscale(0%) brightness(1.3)
    drop-shadow(0 0 9px white);
}

/* FOOTER */

.footer {
  margin-top: 34px;
  font-size: 9px;
  letter-spacing: 3px;
  color: rgba(255,255,255,.4);
  transform: translateZ(35px);
}

/* MUSIC */

.music {
  position: fixed;
  bottom: 25px;
  right: 25px;
  z-index: 10;
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: rgba(255,255,255,.09);
  color: white;
  border: 1px solid rgba(255,255,255,.2);
  backdrop-filter: blur(15px);
  cursor: pointer;
  transition: .3s;
}

.music:hover {
  background: rgba(255,255,255,.25);
  box-shadow: 0 0 25px rgba(255,255,255,.25);
}

/* CLICK TO START */

#start-screen {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.18);
  backdrop-filter: blur(3px);
  cursor: pointer;
  transition: opacity .8s ease, visibility .8s ease;
}

#start-screen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.start-content {
  text-align: center;
  animation: startPulse 2s infinite;
}

.start-content p {
  font-size: 11px;
  letter-spacing: 5px;
  color: rgba(255,255,255,.85);
}

.start-line {
  width: 35px;
  height: 1px;
  background: white;
  margin: 18px auto;
  box-shadow: 0 0 15px white;
}

/* ANIMATIONS */

@keyframes entrance {
  from {
    opacity: 0;
    transform: translateY(30px) scale(.9);
    filter: blur(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

@keyframes startPulse {
  50% { opacity: .45; }
}

@media(max-width: 500px) {
  .floating {
    min-width: 0;
    width: calc(100vw - 35px);
    padding: 45px 20px;
  }

  .glitch-text {
    font-size: 65px;
  }

  .socials {
    gap: 12px;
  }
}
</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video id="bg-video" autoplay muted loop playsinline preload="auto">
  <source src="./background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>
<canvas id="snow-canvas"></canvas>

<!-- MAIN CONTENT -->
<main class="scene" id="scene">
  <div class="floating" id="floating">

    <div class="glass"></div>

    <div class="glitch-text">
      <span class="glitch-layer glitch-r">Staged</span>
      <span class="glitch-layer glitch-g">Staged</span>
      <span class="glitch-layer glitch-b">Staged</span>
      <span>Staged</span>
    </div>

    <div id="typewriter"></div>

    <div class="socials">
      <a href="https://www.tiktok.com/@h8x1" target="_blank" rel="noopener noreferrer">
        <img src="tiktok.webp" alt="TikTok">
      </a>

      <a href="https://www.youtube.com/@wic.001" target="_blank" rel="noopener noreferrer">
        <img src="youtube.png" alt="YouTube">
      </a>

      <a href="https://www.roblox.com/users/3675540/profile" target="_blank" rel="noopener noreferrer">
        <img src="roblox.webp" alt="Roblox">
      </a>

      <a href="https://www.instagram.com/wic.001/" target="_blank" rel="noopener noreferrer">
        <img src="insta.webp" alt="Instagram">
      </a>
    </div>

    <div class="footer">WIC WAS HERE © 2026</div>

  </div>
</main>

<!-- AUDIO -->
<audio id="bg-music" loop preload="auto">
  <source src="./song.mp3" type="audio/mpeg">
</audio>

<button class="music" id="music" aria-label="Toggle music">♫</button>

<!-- FIRST CLICK SCREEN -->
<div id="start-screen">
  <div class="start-content">
    <p>CLICK TO ENTER</p>
    <div class="start-line"></div>
  </div>
</div>

<script>

/* FIRST CLICK: START VIDEO AND MUSIC */

const video = document.getElementById("bg-video");
const audio = document.getElementById("bg-music");
const startScreen = document.getElementById("start-screen");
const musicButton = document.getElementById("music");

let started = false;

async function startExperience() {
  if (started) return;

  started = true;

  // Both playback calls happen directly inside the user click.
  const videoPromise = video.play();
  const audioPromise = audio.play();

  const [videoResult, audioResult] = await Promise.allSettled([
    videoPromise,
    audioPromise
  ]);

  if (videoResult.status === "rejected") {
    console.error("VIDEO ERROR:", videoResult.reason);
  }

  if (audioResult.status === "rejected") {
    console.error("MUSIC ERROR:", audioResult.reason);
  }

  musicButton.textContent = audio.paused ? "♪" : "♫";

  startScreen.classList.add("hidden");
}

startScreen.addEventListener("click", startExperience, { once: true });

/* MUSIC CONTROL */

musicButton.addEventListener("click", async () => {
  if (audio.paused) {
    try {
      await audio.play();
      musicButton.textContent = "♫";
    } catch (error) {
      console.error("Music error:", error);
    }
  } else {
    audio.pause();
    musicButton.textContent = "♪";
  }
});

/* VIDEO ERROR DETECTION */

video.addEventListener("error", () => {
  console.error(
    "VIDEO FAILED TO LOAD:",
    video.error?.message,
    video.currentSrc
  );
});

video.addEventListener("playing", () => {
  console.log("Background video is playing.");
});

audio.addEventListener("error", () => {
  console.error("MUSIC FAILED TO LOAD:", audio.error);
});

/* STRONGER 3D MOUSE MOVEMENT */

const floating = document.getElementById("floating");
const scene = document.getElementById("scene");

let targetX = 0;
let targetY = 0;
let targetMoveX = 0;
let targetMoveY = 0;

let currentX = 0;
let currentY = 0;
let currentMoveX = 0;
let currentMoveY = 0;

scene.addEventListener("mousemove", (e) => {
  const rect = scene.getBoundingClientRect();

  const mouseX = (e.clientX - (rect.left + rect.width / 2))
    / (rect.width / 2);

  const mouseY = (e.clientY - (rect.top + rect.height / 2))
    / (rect.height / 2);

  // Much stronger rotation.
  targetX = mouseY * -22;
  targetY = mouseX * 22;

  // Actual card movement follows cursor.
  targetMoveX = mouseX * 45;
  targetMoveY = mouseY * 35;

  const cardRect = floating.getBoundingClientRect();

  floating.style.setProperty(
    "--mx",
    `${e.clientX - cardRect.left}px`
  );

  floating.style.setProperty(
    "--my",
    `${e.clientY - cardRect.top}px`
  );
});

scene.addEventListener("mouseleave", () => {
  targetX = 0;
  targetY = 0;
  targetMoveX = 0;
  targetMoveY = 0;

  floating.style.setProperty("--mx", "50%");
  floating.style.setProperty("--my", "50%");
});

function animateCard() {
  // Smooth but responsive inertia.
  currentX += (targetX - currentX) * .11;
  currentY += (targetY - currentY) * .11;
  currentMoveX += (targetMoveX - currentMoveX) * .11;
  currentMoveY += (targetMoveY - currentMoveY) * .11;

  floating.style.transform = `
    translate3d(${currentMoveX}px, ${currentMoveY}px, 0)
    rotateX(${currentX}deg)
    rotateY(${currentY}deg)
  `;

  requestAnimationFrame(animateCard);
}

animateCard();

/* GLITCH */

const r = document.querySelector(".glitch-r");
const g = document.querySelector(".glitch-g");
const b = document.querySelector(".glitch-b");

document.addEventListener("mousemove", e => {
  const x = (e.clientX - innerWidth / 2) / 90;
  const y = (e.clientY - innerHeight / 2) / 90;

  r.style.transform = `translate(${-x}px, ${-y}px)`;
  g.style.transform = `translate(${x}px, ${y}px)`;
  b.style.transform = `translate(${y}px, ${-x}px)`;
});

/* TYPEWRITER */

const messages = [
  "Fuck you S0cial!",
  "QUÉBECOIS CERTIFIED!!",
  "all my links below"
];

let i = 0, j = 0, deleting = false, pause = 0;

const typeTarget = document.getElementById("typewriter");

function type() {
  const message = messages[i];
  typeTarget.textContent = message.substring(0, j);

  if (!deleting && j < message.length) {
    j++;
  } else if (deleting && j > 0) {
    j--;
  } else {
    deleting = !deleting;

    if (!deleting) {
      i = (i + 1) % messages.length;
    } else {
      pause = 12;
    }
  }

  const speed = pause > 0
    ? (pause--, 1000)
    : deleting ? 45 : 85;

  setTimeout(type, speed);
}

type();

/* SNOW */

const canvas = document.getElementById("snow-canvas");
const ctx = canvas.getContext("2d");

let width, height;

function resizeCanvas() {
  const dpr = Math.min(devicePixelRatio || 1, 2);

  width = innerWidth;
  height = innerHeight;

  canvas.width = width * dpr;
  canvas.height = height * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const mouse = { x: -1000, y: -1000 };

document.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

class Particle {
  constructor() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.baseX = this.x;
    this.baseY = this.y;
    this.size = Math.random() * 1.5 + .5;
    this.speed = Math.random() * .15 + .04;
  }

  update() {
    const dx = mouse.x - this.x;
    const dy = mouse.y - this.y;
    const dist = Math.hypot(dx, dy);

    if (dist < 110 && dist > 0) {
      const force = (110 - dist) / 110;
      this.x -= dx / dist * force * 2;
      this.y -= dy / dist * force * 2;
    } else {
      this.x += (this.baseX - this.x) * .025;
      this.y += (this.baseY - this.y) * .025;
      this.y += this.speed;
    }

    if (this.y > height) {
      this.y = 0;
      this.baseY = Math.random() * height;
    }

    ctx.fillStyle = "rgba(255,255,255,.65)";
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

const particles = Array.from(
  { length: 100 },
  () => new Particle()
);

function animateSnow() {
  ctx.clearRect(0, 0, width, height);
  particles.forEach(p => p.update());
  requestAnimationFrame(animateSnow);
}

animateSnow();

</script>
</body>
</html>
