
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wic was here!</title>

<style>
@font-face {
  font-family: 'MostWanted';
  src: url('mostwanted(1).ttf') format('truetype');
}

@font-face {
  font-family: 'CodeFont';
  src: url('Code.ttf') format('truetype');
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'CodeFont', monospace;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* BACKGROUND VIDEO */
#bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  z-index: -1;
  pointer-events: none;
}

/* SNOW */
#snow-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* CARD CONTAINER */
.card-container {
  perspective: 1200px;
  z-index: 2;
  padding: 20px;
}

/* GLASS CARD */
.glass-box {
  position: relative;
  width: 380px;
  padding: 40px;
  text-align: center;
  color: white;
  border-radius: 25px;

  background: rgba(255,255,255,0.055);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);

  border: 1px solid rgba(255,255,255,0.18);

  box-shadow:
    0 20px 60px rgba(0,0,0,0.5),
    inset 0 0 20px rgba(255,255,255,0.04);

  transform-style: preserve-3d;
  transition: transform 0.15s ease-out;
  overflow: hidden;
  animation: unfold 1.3s ease forwards;
}

/* MOUSE LIGHT REFLECTION */
.glass-box::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(
    circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
    rgba(255,255,255,0.24),
    transparent 55%
  );
  opacity: 0.8;
  pointer-events: none;
  z-index: 0;
}

/* CARD CONTENT */
.card-content {
  position: relative;
  z-index: 2;
  transform: translateZ(35px);
}

/* GLITCH TITLE */
.glitch-text {
  position: relative;
  font-size: 3.5em;
  font-weight: bold;
  letter-spacing: 4px;
  text-transform: uppercase;
  font-family: 'MostWanted', sans-serif;
}

.glitch-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  pointer-events: none;
}

.glitch-r {
  color: red;
  mix-blend-mode: screen;
}

.glitch-g {
  color: lime;
  mix-blend-mode: screen;
}

.glitch-b {
  color: blue;
  mix-blend-mode: screen;
}

/* TYPEWRITER */
#typewriter {
  font-size: 1.2em;
  margin-top: 20px;
  min-height: 25px;
  text-shadow: 0 0 8px white, 0 0 20px #00f0ff;
  white-space: nowrap;
  overflow: hidden;
  border-right: 2px solid white;
  font-family: 'CodeFont', monospace;
}

/* SOCIAL ICONS */
.social-icons-inside {
  margin-top: 30px;
  display: flex;
  justify-content: center;
  gap: 20px;
}

.social-icons-inside a img {
  width: 42px;
  height: 42px;
  object-fit: contain;
  filter: drop-shadow(0 0 8px white);
  transition: 0.3s ease;
  border-radius: 12px;
}

.social-icons-inside a:hover img {
  transform: translateY(-7px) scale(1.15);
  filter: drop-shadow(0 0 18px white);
}

/* ANIMATION */
@keyframes unfold {
  from {
    opacity: 0;
    transform: rotateX(-15deg) scale(0.8);
  }
  to {
    opacity: 1;
    transform: rotateX(0deg) scale(1);
  }
}

/* MOBILE */
@media (max-width: 500px) {
  .glass-box {
    width: min(380px, 85vw);
    padding: 30px 20px;
  }

  .glitch-text {
    font-size: 2.7em;
  }

  .social-icons-inside {
    gap: 15px;
  }

  .social-icons-inside a img {
    width: 36px;
    height: 36px;
  }
}
</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video id="bg-video" autoplay muted loop playsinline>
  <source src="background.mp4" type="video/mp4">
</video>

<!-- SNOW -->
<canvas id="snow-canvas"></canvas>

<!-- CARD -->
<div class="card-container">
  <div class="glass-box" id="card">

    <div class="card-content">

      <div class="glitch-text">
        <span class="glitch-layer glitch-r">Staged</span>
        <span class="glitch-layer glitch-g">Staged</span>
        <span class="glitch-layer glitch-b">Staged</span>
        <span>Staged</span>
      </div>

      <div id="typewriter"></div>

      <div class="social-icons-inside">

        <a href="https://www.tiktok.com/@h8x1" target="_blank" rel="noopener noreferrer">
          <img src="tiktok.webp" alt="TikTok">
        </a>

        <a href="https://www.youtube.com/@wic.001" target="_blank" rel="noopener noreferrer">
          <img src="youtube.png" alt="YouTube">
        </a>

        <a href="https://www.roblox.com/users/3675540/profile" target="_blank" rel="noopener noreferrer">
          <img src="roblox.webp" alt="Roblox">
        </a>

        <a href="https://www.instagram.com/wic.001/" target="_blank" rel="noopener noreferrer">
          <img src="insta.webp" alt="Instagram">
        </a>

      </div>

    </div>
  </div>
</div>

<!-- MUSIC -->
<audio id="bg-music" autoplay loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>

/* MUSIC AUTOPLAY */
const audio = document.getElementById("bg-music");

function startMusic() {
  audio.play().catch(() => {});
}

window.addEventListener("load", startMusic);
document.addEventListener("click", startMusic, { once: true });

/* 3D MOUSE CARD EFFECT */
const card = document.getElementById("card");
const container = document.querySelector(".card-container");

let rect;

container.addEventListener("mousemove", (e) => {
  rect = card.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const centerX = rect.width / 2;
  const centerY = rect.height / 2;

  const rotateX = ((y - centerY) / centerY) * -12;
  const rotateY = ((x - centerX) / centerX) * 12;

  card.style.transform =
    `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.04,1.04,1.04)`;

  card.style.setProperty("--mouse-x", `${x}px`);
  card.style.setProperty("--mouse-y", `${y}px`);
});

container.addEventListener("mouseleave", () => {
  card.style.transform =
    "rotateX(0deg) rotateY(0deg) scale3d(1,1,1)";

  card.style.setProperty("--mouse-x", "50%");
  card.style.setProperty("--mouse-y", "50%");
});

/* SNOW PARTICLES */
const canvas = document.getElementById("snow-canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const mouse = { x: null, y: null };

window.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

window.addEventListener("mouseout", e => {
  if (!e.relatedTarget) {
    mouse.x = null;
    mouse.y = null;
  }
});

class Particle {
  constructor() {
    this.reset();
    this.baseX = this.x;
    this.baseY = this.y;
    this.density = Math.random() * 30 + 1;
  }

  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 1;
  }

  draw() {
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }

  update() {
    if (mouse.x !== null && mouse.y !== null) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 120 && dist > 0) {
        const force = (120 - dist) / 120;
        this.x -= (dx / dist) * force * this.density;
        this.y -= (dy / dist) * force * this.density;
      } else {
        this.x += (this.baseX - this.x) / 10;
        this.y += (this.baseY - this.y) / 10;
      }
    } else {
      this.x += (this.baseX - this.x) / 10;
      this.y += (this.baseY - this.y) / 10;
    }

    this.draw();
  }
}

const particlesArray = [];

for (let i = 0; i < 200; i++) {
  particlesArray.push(new Particle());
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particlesArray.forEach(p => p.update());
  requestAnimationFrame(animate);
}

animate();

/* TYPEWRITER */
const messages = [
  "Fuck you S0cial!",
  "QUÉBECOIS CERTIFIED!!",
  "all my links below"
];

let i = 0;
let j = 0;
let isDeleting = false;
let waitTime = 0;

const target = document.getElementById("typewriter");

function type() {
  const txt = messages[i].substring(0, j);
  target.textContent = txt;

  if (!isDeleting && j < messages[i].length) {
    j++;
  } else if (isDeleting && j > 0) {
    j--;
  } else {
    if (!isDeleting) waitTime = 5;

    isDeleting = !isDeleting;

    if (!isDeleting) {
      i = (i + 1) % messages.length;
    }
  }

  const speed = isDeleting ? 100 : 80;

  setTimeout(type, waitTime-- > 0 ? 1000 : speed);
}

type();

/* GLITCH MOUSE MOVEMENT */
const glitchR = document.querySelector(".glitch-r");
const glitchG = document.querySelector(".glitch-g");
const glitchB = document.querySelector(".glitch-b");

document.addEventListener("mousemove", e => {
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;

  const offsetX = (e.clientX - centerX) / 90;
  const offsetY = (e.clientY - centerY) / 90;

  glitchR.style.transform =
    `translate(${-offsetX}px, ${-offsetY}px)`;

  glitchG.style.transform =
    `translate(${offsetX}px, ${offsetY}px)`;

  glitchB.style.transform =
    `translate(${offsetY}px, ${-offsetX}px)`;
});

</script>

</body>
</html>
