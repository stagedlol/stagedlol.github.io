
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sean's online place</title>

<style>
@font-face {
  font-family: MostWanted;
  src: url("mostwanted(1).ttf") format("truetype");
}

@font-face {
  font-family: CodeFont;
  src: url("Code.ttf") format("truetype");
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --panel: rgba(8, 8, 8, .91);
  --border: rgba(255,255,255,.075);
  --muted: rgba(255,255,255,.48);
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  background: #050505;
  color: #eee;
  font-family: CodeFont, monospace;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* BACKGROUND VIDEO */

#bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  background: #050505;
  filter: brightness(.35);
}

.background-shade {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: rgba(0,0,0,.62);
}

#snow-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}

/* PROFILE LAYOUT */

.profile {
  width: min(560px, calc(100vw - 32px));
  margin: 90px auto;
  display: flex;
  flex-direction: column;
  gap: 13px;
  perspective: 1000px;
  position: relative;
  z-index: 2;
  transform-style: preserve-3d;
  will-change: transform;
}

/* CARDS */

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  position: relative;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 12px 45px rgba(0,0,0,.25);

  transform-style: preserve-3d;
  will-change: transform;

  transition:
    transform .22s ease-out,
    border-color .4s ease,
    background .4s ease;

  overflow: hidden;
  isolation: isolate;
}

/* SMOKY GLASS REFLECTION */

.panel::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;

  background: radial-gradient(
    300px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
    rgba(210, 220, 230, .075),
    rgba(170, 180, 190, .025) 35%,
    transparent 75%
  );

  opacity: var(--glow, 0);
  transition: opacity .3s ease;
}

.panel::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 0;

  background: linear-gradient(
    125deg,
    rgba(255,255,255,.025),
    transparent 35%,
    rgba(255,255,255,.012) 70%,
    transparent
  );

  opacity: .6;
}

/* KEEP CONTENT ABOVE REFLECTION */

.panel > * {
  position: relative;
  z-index: 1;
}

/* MAIN PROFILE */

.main-panel {
  min-height: 235px;
  padding: 27px;
  overflow: hidden;
  text-align: center;
}

.profile-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 27px;
  text-align: center;
}

/* RGB NAME */

.profile-name {
  font-family: MostWanted, sans-serif;
  font-size: 36px;
  letter-spacing: 3px;
  text-align: center;
  color: white;

  text-shadow:
    -3px 0 rgba(255,0,0,.95),
    3px 0 rgba(0,100,255,.95),
    0 0 22px rgba(255,255,255,.3);

  animation: rgbPulse 1.8s infinite alternate;
}

@keyframes rgbPulse {
  0% {
    text-shadow:
      -3px 0 rgba(255,0,0,.8),
      3px 0 rgba(0,100,255,.8),
      0 0 15px rgba(255,255,255,.2);
  }

  100% {
    text-shadow:
      -6px 2px rgba(255,0,0,1),
      6px -2px rgba(0,100,255,1),
      0 0 30px rgba(255,255,255,.5);
  }
}

.profile-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 17px;
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
}

.meta-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.meta-item svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
}

/* TYPEWRITER */

#typewriter {
  min-height: 22px;
  font-size: 13px;
  letter-spacing: 1.5px;
  color: rgba(255,255,255,.8);
  margin-top: 10px;
  text-align: center;
}

/* SOCIAL ICONS */

.socials {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  margin-top: 30px;
}

.socials a {
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  text-decoration: none;
  transition: transform .35s cubic-bezier(.16,1,.3,1);
  cursor: pointer;
}

.socials img {
  width: 27px;
  height: 27px;
  object-fit: contain;
  filter: grayscale(100%) brightness(1.5);
  transition: .35s ease;
}

.socials a:hover {
  transform: translateY(-7px) scale(1.35);
}

.socials a:hover img {
  filter: grayscale(0%) brightness(1.4)
    drop-shadow(0 0 12px white);
}

/* RESPONSIVE */

@media(max-width: 550px) {
  .profile {
    margin: 50px auto;
  }

  .main-panel {
    padding: 22px;
  }

  .profile-meta {
    font-size: 9px;
    gap: 9px;
  }

  .profile-name {
    font-size: 29px;
  }

  .socials {
    gap: 25px;
  }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
  .panel {
    transition: none;
  }

  .profile-name {
    animation: none;
  }
}

/* ENTRY SCREEN */

#start-screen {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(0,0,0,.65);
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: opacity .5s ease, visibility .5s ease;
}

#start-screen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.start-text {
  font-size: 11px;
  letter-spacing: 5px;
  animation: pulse 2s infinite;
  text-align: center;
}

@keyframes pulse {
  50% { opacity: .35; }
}
</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->

<video id="bg-video" autoplay muted loop playsinline preload="auto">
  <source src="/background.mp4" type="video/mp4">
</video>

<div class="background-shade"></div>
<canvas id="snow-canvas"></canvas>

<!-- PROFILE -->

<main class="profile" id="profile">

  <!-- MAIN CARD -->

  <section class="panel main-panel">

    <div class="profile-top">

      <div class="profile-name">Sean</div>

      <div class="profile-meta">

        <div class="meta-item">
          <svg viewBox="0 0 24 24">
            <path d="M12 5c-5.5 0-10 7-10 7s4.5 7 10 7 10-7 10-7-4.5-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
          </svg>
          <span>421</span>
        </div>

        <div class="meta-item">
          <svg viewBox="0 0 24 24">
            <path d="M12 2a8 8 0 0 0-8 8c0 6 8 12 8 12s8-6 8-12a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
          </svg>
          <span>CANADA</span>
        </div>

      </div>
    </div>

    <div id="typewriter"></div>

    <!-- CLICKABLE SOCIAL LINKS -->

    <div class="socials">

      <a href="https://www.tiktok.com/@h8x1"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="TikTok">
        <img src="tiktok.webp" alt="TikTok">
      </a>

      <a href="https://www.youtube.com/@wic.001"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="YouTube">
        <img src="youtube.png" alt="YouTube">
      </a>

      <a href="https://www.roblox.com/users/3675540/profile"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Roblox">
        <img src="roblox.webp" alt="Roblox">
      </a>

      <a href="https://www.instagram.com/wic.001/"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Instagram">
        <img src="insta.webp" alt="Instagram">
      </a>

    </div>

  </section>

</main>

<!-- BACKGROUND AUDIO (NOT VISIBLE ON INTERFACE) -->

<audio id="bg-music" loop preload="auto">
  <source src="/song.mp3" type="audio/mpeg">
</audio>

<!-- ENTRY SCREEN -->

<div id="start-screen">
  <div class="start-text">CLICK TO ENTER</div>
</div>

<script>

/* FIRST CLICK: START VIDEO + MUSIC */

const video = document.getElementById("bg-video");
const audio = document.getElementById("bg-music");
const startScreen = document.getElementById("start-screen");

let started = false;

function startExperience() {
  if (started) return;

  started = true;

  startScreen.classList.add("hidden");

  video.muted = true;

  video.play().catch(e => {
    console.error("Video playback error:", e);
  });

  audio.play().catch(e => {
    console.error("Audio playback error:", e);
  });
}

startScreen.addEventListener("click", startExperience, { once: true });

/* INDIVIDUAL 3D CARD TILT + SMOKY GLASS */

const panels = document.querySelectorAll(".panel");

let animationFrame;

document.addEventListener("mousemove", e => {

  if (animationFrame) {
    cancelAnimationFrame(animationFrame);
  }

  animationFrame = requestAnimationFrame(() => {

    panels.forEach(panel => {

      const rect = panel.getBoundingClientRect();

      const closestX = Math.max(rect.left, Math.min(e.clientX, rect.right));
      const closestY = Math.max(rect.top, Math.min(e.clientY, rect.bottom));

      const dx = e.clientX - closestX;
      const dy = e.clientY - closestY;

      const distance = Math.hypot(dx, dy);

      const influence = Math.max(0, 1 - distance / 150);

      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;

      const limitedX = Math.max(0, Math.min(1, x));
      const limitedY = Math.max(0, Math.min(1, y));

      const rotateY = (limitedX - .5) * 9 * influence;
      const rotateX = (.5 - limitedY) * 9 * influence;

      const lift = influence * 2;

      panel.style.transform = `
        perspective(900px)
        translateY(${-lift}px)
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)
      `;

      panel.style.setProperty("--mouse-x", `${limitedX * 100}%`);
      panel.style.setProperty("--mouse-y", `${limitedY * 100}%`);
      panel.style.setProperty("--glow", influence * .8);

    });

  });

});

/* RESET CARD EFFECT */

document.addEventListener("mouseleave", () => {

  panels.forEach(panel => {

    panel.style.transform = "";
    panel.style.setProperty("--glow", "0");

  });

});

/* SUBTLE PROFILE MOVEMENT */

const profile = document.getElementById("profile");

let targetX = 0;
let targetY = 0;
let currentX = 0;
let currentY = 0;

document.addEventListener("mousemove", e => {

  const x = e.clientX / innerWidth - .5;
  const y = e.clientY / innerHeight - .5;

  targetX = x * 12;
  targetY = y * 8;

});

document.addEventListener("mouseleave", () => {
  targetX = 0;
  targetY = 0;
});

function animateProfile() {

  currentX += (targetX - currentX) * .08;
  currentY += (targetY - currentY) * .08;

  profile.style.transform =
    `translate3d(${currentX}px, ${currentY}px, 0)`;

  requestAnimationFrame(animateProfile);

}

animateProfile();

/* RGB EFFECT */

const title = document.querySelector(".profile-name");

document.addEventListener("mousemove", e => {

  const x = (e.clientX / innerWidth - .5) * 12;
  const y = (e.clientY / innerHeight - .5) * 12;

  title.style.textShadow = `
    ${-x - 3}px ${y}px 0 rgba(255,0,0,.95),
    ${x + 3}px ${-y}px 0 rgba(0,100,255,.95),
    0 0 22px rgba(255,255,255,.3)
  `;

});

/* TYPEWRITER */

const messages = [
  "Fuck you S0cial!",
  "QUÉBECOIS CERTIFIED!!",
  "all my links below"
];

let messageIndex = 0;
let charIndex = 0;
let deleting = false;

const typeTarget = document.getElementById("typewriter");

function type() {

  const message = messages[messageIndex];

  typeTarget.textContent = message.substring(0, charIndex);

  if (!deleting && charIndex < message.length) {

    charIndex++;
    setTimeout(type, 85);

  } else if (deleting && charIndex > 0) {

    charIndex--;
    setTimeout(type, 45);

  } else {

    deleting = !deleting;

    if (!deleting) {
      messageIndex = (messageIndex + 1) % messages.length;
      setTimeout(type, 500);
    } else {
      setTimeout(type, 1500);
    }

  }

}

type();

/* SNOW PARTICLES */

const canvas = document.getElementById("snow-canvas");
const ctx = canvas.getContext("2d");

let width;
let height;

function resizeCanvas() {

  const dpr = Math.min(devicePixelRatio || 1, 2);

  width = innerWidth;
  height = innerHeight;

  canvas.width = width * dpr;
  canvas.height = height * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const particles = Array.from({length: 100}, () => ({

  x: Math.random() * innerWidth,
  y: Math.random() * innerHeight,
  size: Math.random() * 1.5 + .5,
  speed: Math.random() * .6 + .2

}));

function animateSnow() {

  ctx.clearRect(0, 0, width, height);

  particles.forEach(p => {

    p.y += p.speed;

    if (p.y > height) {
      p.y = -5;
      p.x = Math.random() * width;
    }

    ctx.fillStyle = "rgba(255,255,255,.6)";

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();

  });

  requestAnimationFrame(animateSnow);

}

animateSnow();

/* MEDIA ERROR DETECTION */

video.addEventListener("error", () => {
  console.error("Video failed:", video.currentSrc, video.error);
});

audio.addEventListener("error", () => {
  console.error("Audio failed:", audio.currentSrc, audio.error);
});

</script>

</body>
</html>
