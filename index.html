
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ps4.lol</title>

<style>
@font-face {
    font-family: "MostWanted";
    src: url("mostwanted(1).ttf") format("truetype");
}

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: black;
}

body {
    display: grid;
    place-items: center;
}

/* BACKGROUND VIDEO */

#background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}

/* MAIN CONTENT */

.content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 20px;
}

/* TITLE */

.title-wrap {
    position: relative;
    display: grid;
    place-items: center;
    margin-bottom: 30px;
    perspective: 1000px;
}

.title-wrap h1 {
    grid-area: 1 / 1;
    z-index: 5;
    margin: 0;
    color: white;
    font-family: "MostWanted", sans-serif;
    font-size: clamp(76px, 16vw, 220px);
    font-weight: normal;
    line-height: 1;
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 5px 22px rgba(0,0,0,.4);
}

/* RGB TEXT LAYERS */

.rgb-layer {
    grid-area: 1 / 1;
    position: relative;
    z-index: 2;
    opacity: 0;
    font-family: "MostWanted", sans-serif;
    font-size: clamp(76px, 16vw, 220px);
    font-weight: normal;
    line-height: 1;
    white-space: nowrap;
    pointer-events: none;
    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        opacity .15s ease;
    will-change: transform;
}

/* FULL RGB COLORS */

.rgb-red {
    color: #ff003c;
    text-shadow:
        0 0 12px #ff003c,
        0 0 30px #ff003c;
}

.rgb-green {
    color: #00ff55;
    text-shadow:
        0 0 12px #00ff55,
        0 0 30px #00ff55;
}

.rgb-blue {
    color: #0066ff;
    text-shadow:
        0 0 12px #0066ff,
        0 0 30px #0066ff;
}

/* SOCIAL LOGOS */

.logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(22px, 4vw, 48px);
}

.logo {
    display: grid;
    place-items: center;
    width: clamp(48px, 5.5vw, 68px);
    height: clamp(48px, 5.5vw, 68px);
    transform: translateY(0) scale(1);
    transition: transform .25s ease;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
}

/* LOGO HOVER */

.logo:hover {
    transform: translateY(-10px) scale(1.15);
}

/* MOBILE */

@media (max-width: 520px) {
    .title-wrap h1,
    .rgb-layer {
        font-size: clamp(66px, 17vw, 110px);
    }

    .logos {
        gap: 22px;
    }

    .logo {
        width: 43px;
        height: 43px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .logo,
    .rgb-layer {
        transition: none;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video id="background" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
</video>

<main class="content">

    <!-- RGB TITLE -->
    <div class="title-wrap" id="titleWrap">

        <span class="rgb-layer rgb-red">ps4.lol</span>
        <span class="rgb-layer rgb-green">ps4.lol</span>
        <span class="rgb-layer rgb-blue">ps4.lol</span>

        <!-- ORIGINAL WHITE TEXT -->
        <h1>ps4.lol</h1>

    </div>

    <!-- YOUR ORIGINAL LOGOS -->
    <div class="logos">

        <div class="logo">
            <img src="insta.webp" alt="Instagram">
        </div>

        <div class="logo">
            <img src="tiktok.webp" alt="TikTok">
        </div>

        <div class="logo">
            <img src="youtube.png" alt="YouTube">
        </div>

        <div class="logo">
            <img src="roblox.webp" alt="Roblox">
        </div>

    </div>

</main>

<!-- MUSIC -->
<audio id="music" src="song.mp3" autoplay loop preload="auto"></audio>

<script>

/* MUSIC AUTOPLAY */

const music = document.getElementById("music");

music.volume = 1;

music.play().catch(() => {

    const resumeMusic = () => {
        music.play().catch(() => {});

        window.removeEventListener("pointerdown", resumeMusic);
        window.removeEventListener("keydown", resumeMusic);
        window.removeEventListener("touchstart", resumeMusic);
    };

    window.addEventListener("pointerdown", resumeMusic);
    window.addEventListener("keydown", resumeMusic);
    window.addEventListener("touchstart", resumeMusic);

});


/* ADVANCED RGB MOUSE EFFECT */

const title = document.getElementById("titleWrap");

const red = document.querySelector(".rgb-red");
const green = document.querySelector(".rgb-green");
const blue = document.querySelector(".rgb-blue");

const layers = [red, green, blue];

const radius = 400;
const maxSpread = 65;

window.addEventListener("pointermove", (event) => {

    const rect = title.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const dx = event.clientX - centerX;
    const dy = event.clientY - centerY;

    const distance = Math.sqrt(dx * dx + dy * dy);

    let intensity = Math.max(0, 1 - distance / radius);

    if (intensity <= 0) {
        layers.forEach(layer => {
            layer.style.opacity = "0";
            layer.style.transform = "translate3d(0,0,0)";
        });

        return;
    }

    // Full opacity and saturated RGB colors.
    const spread = intensity * maxSpread;

    // Mouse direction changes the direction of separation.
    const angle = Math.atan2(dy, dx);

    // Each RGB layer has an independent movement direction.
    const redAngle = angle + 2.1;
    const greenAngle = angle - 2.0;
    const blueAngle = angle + 4.1;

    const redX = Math.cos(redAngle) * spread;
    const redY = Math.sin(redAngle) * spread;

    const greenX = Math.cos(greenAngle) * spread;
    const greenY = Math.sin(greenAngle) * spread;

    const blueX = Math.cos(blueAngle) * spread;
    const blueY = Math.sin(blueAngle) * spread;

    red.style.transform =
        `translate3d(${redX}px, ${redY}px, 0) rotate(-3deg)`;

    green.style.transform =
        `translate3d(${greenX}px, ${greenY}px, 0) rotate(3deg)`;

    blue.style.transform =
        `translate3d(${blueX}px, ${blueY}px, 0) rotate(-2deg)`;

    // Each color appears at 100% opacity.
    layers.forEach(layer => {
        layer.style.opacity = "1";
    });

});

</script>

</body>
</html>
